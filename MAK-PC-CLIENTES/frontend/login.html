<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Taller MAK-PC</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="css/styles.css?v=2.1">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body {
      background: var(--navy-950);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #fff;
    }
    .login-container {
      background: var(--navy-900);
      padding: 3rem;
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .login-container img {
      width: 80px;
      margin-bottom: 1rem;
    }
    .login-container h2 {
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }
    .login-container p {
      color: var(--slate-400);
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--slate-300);
      font-size: 0.85rem;
    }
    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-md);
      color: #fff;
      font-family: inherit;
      transition: all 0.3s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--gold-500);
      box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2);
    }
    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: var(--gold-500);
      color: var(--navy-950);
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s;
    }
    .btn-login:hover {
      background: var(--gold-400);
      transform: translateY(-2px);
    }
    .error-msg {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.75rem;
      border-radius: var(--radius-sm);
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="img/logo.png" alt="MAK-PC Logo">
    <h2>Sistema de Taller</h2>
    <p>Inicia sesión para continuar</p>

    <div class="error-msg" id="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" class="form-control" required placeholder="ejemplo@makpc.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-login" id="btn-submit">
        <i class="ph-bold ph-sign-in"></i> Ingresar al Sistema
      </button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Si ya está logueado, redirigir
      const user = localStorage.getItem('usuario_makpc');
      if (user) {
        window.location.href = 'index.html';
      }

      const form = document.getElementById('login-form');
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('btn-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        errorDiv.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="ph-bold ph-spinner ph-spin"></i> Conectando...';

        try {
          // Llama al endpoint de login
          const result = await API.login({ email, password });
          
          if (result.success) {
            // Guardar usuario en localStorage
            localStorage.setItem('usuario_makpc', JSON.stringify(result.data.usuario));
            if (result.data.token) {
                localStorage.setItem('token_makpc', result.data.token);
            }
            window.location.href = 'index.html';
          }
        } catch (error) {
          errorDiv.textContent = error.message;
          errorDiv.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.innerHTML = '<i class="ph-bold ph-sign-in"></i> Ingresar al Sistema';
        }
      });
    });
  </script>
</body>
</html>
